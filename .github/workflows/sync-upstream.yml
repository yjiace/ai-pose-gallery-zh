name: Sync Upstream

on:
  schedule:
    # 每天 00:00 (UTC) 自动执行一次，可按需修改
    - cron: '30 */6 * * *	'
  # 支持在 GitHub Actions 页面手动点击触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 添加上游仓库源
          git remote add upstream https://github.com/anhao/ai-pose-gallery-zh.git
          
          # 2. 拉取上游最新分支
          git fetch upstream main
          
          # 3. 切换并合并到本地 main 分支
          git checkout main
          git merge upstream/main -m "chore: sync upstream changes" --no-edit
          
          # 4. 推送到自己的 origin 仓库
          git push origin main